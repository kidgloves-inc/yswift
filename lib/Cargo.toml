[package]
name = "yniffi"
version = "0.1.0"
edition = "2021"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["uniffi/cli"]

[features]
# Compiles `src/probe.rs` into a normal (non-test) build, so the cargo-fuzz
# crate under `fuzz/` can reach the binding's own entry points.
fuzzing = []

[dependencies]
yrs = { version = "0.27.4", features = ["sync"] }
thiserror = "1.0.38"
uniffi = "0.27.1"

[dev-dependencies]
# The property tier. Same major version yrs itself develops against, so a
# property written here could move upstream unchanged.
proptest = "1"
# The retired core, linked beside the pinned one so that P6's negative runs
# the decoder that truncated 53 bit client ids rather than a model of it.
# Test builds only; nothing in the shipped library sees it.
yrs_legacy = { package = "yrs", version = "=0.18.2" }

[build-dependencies]
uniffi = { version = "0.27.1", features = [ "build" ] }

[lib]
name = "uniffi_yniffi"
path = "src/lib.rs"
# staticlib is what the XCFramework links. rlib is what lets another crate in
# this tree, the cargo-fuzz targets under `fuzz/`, depend on the binding and
# call into it; a staticlib alone cannot be a Cargo dependency. cdylib is what
# a JVM or Android loads: scripts/build-android.sh builds it per ABI and the
# Kotlin bindings (kidgloves-inc/ykt) call it through JNA.
crate-type = ["staticlib", "rlib", "cdylib"]
