# Pins the compiler the XCFramework is built with, the Apple targets
# scripts/build-xcframework.sh needs, and the Android targets
# scripts/build-android.sh needs. rustup reads this file; a bump here is a
# visible change to the tree, which is what makes a cached build invalidate.
[toolchain]
channel = "1.98.0"
targets = [
    "x86_64-apple-ios",
    "aarch64-apple-ios-sim",
    "aarch64-apple-ios",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
]
